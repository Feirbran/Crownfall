<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <h1>PeerJS + TURN Test</h1>
  <div id="log"></div>
  <script>
    function log(msg) {
      console.log(msg);
      document.getElementById('log').innerHTML += '<p>' + msg + '</p>';
    }

    const peerConfig = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          }
        ]
      }
    };

    const hostCode = 'cf' + Math.floor(1000 + Math.random() * 9000);
    log('Host ID: ' + hostCode);

    const host = new Peer(hostCode, peerConfig);
    host.on('open', (id) => {
      log('Host listening on ID: ' + id);

      const guest = new Peer(peerConfig);
      guest.on('open', (gId) => {
        log('Guest listening on ID: ' + gId);
        const conn = guest.connect(id, { reliable: true });

        conn.on('open', () => {
          log('TURN SUCCESS: Connected!');
          conn.send({ test: 'relay_works' });
        });

        conn.on('error', (e) => log('Guest conn err: ' + e));
      });
      guest.on('error', (e) => log('Guest peer err: ' + e));
    });

    host.on('connection', (conn) => {
      conn.on('data', (d) => {
        log('Host got data: ' + JSON.stringify(d));
      });
    });

    host.on('error', (e) => log('Host peer err: ' + e));
  </script>
</body>
</html>
